                point = new THREE.Vector3();
                if (!dragRay.ray.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(normal, current), point)) return;
            }
            lamps[draggingLamp] = {
                f: point.x * frame.fwd.x + point.z * frame.fwd.y,
                l: point.x * frame.left.x + point.z * frame.left.y,
                y: Math.min(e.box.max.y, Math.max(e.box.min.y, point.y))
            };
            lampsEdited = true;
        });

        function endLampDrag() {
            if (!draggingLamp) return;
            draggingLamp = null;
            controls.enabled = true;
        }
        window.addEventListener('pointerup', endLampDrag);
        window.addEventListener('pointercancel', endLampDrag);

        // In front of the car, slightly to the side and above, so both lamps can be reached
        function lightsPose() {
            return { az: roadPivot.rotation.y + 0.35, h: 0.9, d: 4.2 };
        }

        // ---- Tyre pressures on the wheels ----

        const WHEEL_IDS = ['FL', 'FR', 'RL', 'RR'];
        const WHEEL_NAME_RE = /wheel|tire|tyre|\brim|ruot|cerch|gomm|pneu|reifen/i;
        const NOT_WHEEL_RE = /steer|volante|spare|scorta/i;
        const LABEL_EDGE_MARGIN_PX = 8;
        const LABEL_GAP_PX = 8;

        let wheels = null;            // { FL: {x, y, z, r}, ... } in scene coordinates
        let suggestedWheels = null;
        let wheelsEdited = false;     // true once the user moved a marker (saved in the model config)
        let wheelsRoadYaw = 0;        // driving direction the wheel corners were assigned with
        let tireData = null;          // { FL: {pressure, temp, level} }, level 0 ok, 1 warning, 2 critical
        let tireOverlay = null;
        const tireLabels = {}, tireHandles = {}, tireRings = {}, tireLeaders = {};

        function cloneWheels(w) {
            return w ? JSON.parse(JSON.stringify(w)) : null;
        }

        // The driving direction comes from the road, which follows the driving view
        function carFrame() {
            const yaw = roadPivot.rotation.y;
            const fwd = new THREE.Vector2(Math.sin(yaw), Math.cos(yaw));   // (x, z)
            const left = new THREE.Vector2(fwd.y, -fwd.x);                  // driver's left when facing fwd
            return { fwd, left };
        }

        function quadrantOf(x, z, frame) {
            const f = x * frame.fwd.x + z * frame.fwd.y;
            const l = x * frame.left.x + z * frame.left.y;
            return (f >= 0 ? 'F' : 'R') + (l >= 0 ? 'L' : 'R');
        }

        function forEachWorldVertex(filter, fn) {
            const v = new THREE.Vector3();
            model.updateMatrixWorld(true);
            model.traverse(o => {
                if (!o.isMesh || !o.geometry.attributes.position || !filter(o)) return;
                const pos = o.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) fn(v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld));
            });
        }

        function meshNames(o) {
            return [o.name, o.parent && o.parent.name].concat([].concat(o.material).map(m => m && m.name)).join(' ');
        }

        // 1. Parts named like wheels/tyres: split their vertices into the four corners
        function wheelsFromNames(box, frame) {
            const lowLimit = box.min.y + (box.max.y - box.min.y) * 0.55;
            const boxes = {};
            forEachWorldVertex(o => { const n = meshNames(o); return WHEEL_NAME_RE.test(n) && !NOT_WHEEL_RE.test(n); }, p => {
                if (p.y > lowLimit) return;
                const q = quadrantOf(p.x, p.z, frame);
                (boxes[q] = boxes[q] || new THREE.Box3()).expandByPoint(p);
            });
            const out = {};
            for (const id of WHEEL_IDS) {
                const b = boxes[id];
                if (!b) continue;
                const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
                out[id] = { x: c.x, y: c.y, z: c.z, r: s.y / 2 };
            }
            return out;
        }

        // 2. Tyres are the only parts touching the ground: centroid of the lowest vertices in each corner
        function wheelsFromContacts(box, frame) {
            const h = box.max.y - box.min.y;
            const limit = box.min.y + h * 0.03;
            const acc = {};
            forEachWorldVertex(() => true, p => {
                if (p.y > limit) return;
                const q = quadrantOf(p.x, p.z, frame);
                const a = acc[q] = acc[q] || { x: 0, z: 0, n: 0 };
                a.x += p.x; a.z += p.z; a.n++;
            });
            const r = h * 0.21;
            const out = {};
            for (const id of WHEEL_IDS) {
                const a = acc[id];
                if (!a || a.n < 3) continue;
                out[id] = { x: a.x / a.n, y: box.min.y + r, z: a.z / a.n, r };
            }
            return out;
        }

        // 3. Typical car proportions within the bounding box
        function wheelsFromProportions(box, frame) {
            const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
            const longX = Math.abs(frame.fwd.x) > 0.5;
            const length = longX ? size.x : size.z, width = longX ? size.z : size.x;
            const r = size.y * 0.21;
            const out = {};
            for (const id of WHEEL_IDS) {
                const f = (id[0] === 'F' ? 1 : -1) * length * 0.32;
                const l = (id[1] === 'L' ? 1 : -1) * width * 0.42;
                out[id] = {
                    x: center.x + frame.fwd.x * f + frame.left.x * l,
                    y: box.min.y + r,
                    z: center.z + frame.fwd.y * f + frame.left.y * l,
                    r
                };
            }
            return out;
        }

        function suggestWheels() {
            const box = new THREE.Box3().setFromObject(model);
            const frame = carFrame();
            const byName = wheelsFromNames(box, frame);
            const byContact = wheelsFromContacts(box, frame);
            const byProportion = wheelsFromProportions(box, frame);
            const out = {};
            for (const id of WHEEL_IDS) out[id] = { ...(byName[id] || byContact[id] || byProportion[id]) };
            return out;
        }

        // list: [{ id: 'FL'|'FR'|'RL'|'RR', pressure, temp, level, raw }] or null to hide everything.
        // A sensor that stopped transmitting comes as { id, silent: true, level: 1 } and shows an icon.
        function setTireData(list) {
            if (!list) { tireData = null; return; }
            tireData = {};
            list.forEach(t => { if (WHEEL_IDS.includes(t.id)) tireData[t.id] = t; });
        }

        // Labels appear while the user touches the car and for a while after (all tyres, or only those with a
        // problem); on their own only for a tyre with a new problem, flagged by Android, even while driving.
        const TIRE_SHOW_MS = 15000;
        let tireProblemsOnly = false;
        let tireShowUntil = 0;
        const tireFlashUntil = {};
        let pendingFlash = [];

        function setTireOptions(problemsOnly) {
            tireProblemsOnly = !!problemsOnly;
        }

        function showTires() {
            tireShowUntil = performance.now() + TIRE_SHOW_MS;
        }

        // Started once the tyre's data has arrived and the model is ready
        function flashTires(ids) {
            pendingFlash = pendingFlash.concat((ids || []).filter(id => WHEEL_IDS.includes(id)));
        }

        function tireVisible(id, level) {
            const now = performance.now();
            if ((tireFlashUntil[id] || 0) > now) return true;
            if (isThirdPersonView || (tireProblemsOnly && !level)) return false;
            return userTouching || now < tireShowUntil;
        }

        function levelColor(level) {
            return level === 2 ? '#ef5350' : level === 1 ? '#ffa726' : null;
        }

        function buildTireOverlay() {
            tireOverlay = document.createElement('div');
            tireOverlay.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:150;overflow:hidden;font-family:\'Segoe UI\',system-ui,-apple-system,sans-serif';
            document.getElementById('container').appendChild(tireOverlay);
            for (const id of WHEEL_IDS) {
                // Leader lines live in the scene so the body hides the stretch behind it
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3));
                geometry.setIndex([0, 1, 2, 2, 1, 3]);
                const leader = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide }));
                leader.frustumCulled = false;
                leader.visible = false;
                leader.renderOrder = 2;
                // Small dot where the line meets the wheel; a child, so it hides with the line
                const dot = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8),
                    new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false }));
                dot.renderOrder = 2;
                leader.add(dot);
                leader.userData.dot = dot;
                scene.add(leader);
                tireLeaders[id] = leader;

                const lab = document.createElement('div');
                lab.style.cssText = 'position:absolute;transform:translate(-50%,-50%);text-align:center;line-height:1.15;white-space:nowrap;display:none';
                tireOverlay.appendChild(lab);
                tireLabels[id] = lab;

                // Wizard marker: 48dp circle inside a 64dp touch target
                const hd = document.createElement('div');
                hd.style.cssText = 'position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;display:none;align-items:center;justify-content:center;pointer-events:auto;touch-action:none';
                hd.innerHTML = '<div style="width:48px;height:48px;border-radius:50%;border:3px solid #4da3ff;background:rgba(77,163,255,.3);color:#fff;font:bold 16px sans-serif;display:flex;align-items:center;justify-content:center;box-sizing:border-box;text-shadow:0 0 3px #000"></div>';
                tireOverlay.appendChild(hd);
                tireHandles[id] = hd;
                hd.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    e.stopPropagation();
                    draggingWheel = id;
                    controls.enabled = false;
                });

                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.42, 0.52, 40),
                    new THREE.MeshBasicMaterial({ color: 0xef5350, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
                );
                ring.rotation.x = -Math.PI / 2;
                ring.visible = false;
                scene.add(ring);
                tireRings[id] = ring;
            }
        }

        function projectToScreen(x, y, z, rect) {
            const p = new THREE.Vector3(x, y, z).project(camera);
            return { x: (p.x + 1) / 2 * rect.width, y: (1 - p.y) / 2 * rect.height };
        }

        const LEADER_WIDTH_PX = 1.5;
        const LEADER_DOT_PX = 3.5;

        // Thin ribbon from the outer face of the wheel to a screen point (the label edge), placed at the
        // wheel's depth: drawn with depth test, the stretch passing behind the car body disappears
        function setLeader(leader, id, toX, toY, rect, color, opacity) {
            const w = wheels[id], frame = carFrame();
            const out = (id[1] === 'L' ? 1 : -1) * w.r * 0.4;
            const from = new THREE.Vector3(w.x + frame.left.x * out, w.y, w.z + frame.left.y * out);
            const ndcZ = from.clone().project(camera).z;
            const to = new THREE.Vector3(toX / rect.width * 2 - 1, -(toY / rect.height) * 2 + 1, ndcZ).unproject(camera);
            const worldPerPx = 2 * from.distanceTo(camera.position) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / rect.height;
            const side = to.clone().sub(from).cross(camera.position.clone().sub(from)).normalize()
                .multiplyScalar(worldPerPx * LEADER_WIDTH_PX / 2);
            const pos = leader.geometry.attributes.position;
            pos.setXYZ(0, from.x + side.x, from.y + side.y, from.z + side.z);
            pos.setXYZ(1, from.x - side.x, from.y - side.y, from.z - side.z);
            pos.setXYZ(2, to.x + side.x, to.y + side.y, to.z + side.z);
            pos.setXYZ(3, to.x - side.x, to.y - side.y, to.z - side.z);
            pos.needsUpdate = true;
            leader.material.color.set(color);
            leader.material.opacity = opacity;
            const dot = leader.userData.dot;
            dot.position.copy(from);
            dot.scale.setScalar(worldPerPx * LEADER_DOT_PX);
            dot.material.color.set(color);
            dot.material.opacity = opacity;
            leader.visible = true;
        }

        // Horizontal extent of the model on screen
        function modelScreenBox(rect) {
            const b = new THREE.Box3().setFromObject(model);
            let minX = Infinity, maxX = -Infinity;
            for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
                const p = projectToScreen(x, y, z, rect);
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            }
            return { minX, maxX };
        }

        // Keeps labels on one side from overlapping, inside [top, bottom]
        function spreadVertically(items, top, bottom) {
            items.sort((a, b) => a.y - b.y);
            for (let i = 0; i < items.length; i++) {
                const prev = items[i - 1];
                const min = prev ? prev.y + prev.h / 2 + LABEL_GAP_PX + items[i].h / 2 : top + items[i].h / 2;
                items[i].y = Math.max(items[i].y, min);
            }
            for (let i = items.length - 1; i >= 0; i--) {
                const next = items[i + 1];
                const max = next ? next.y - next.h / 2 - LABEL_GAP_PX - items[i].h / 2 : bottom - items[i].h / 2;
                items[i].y = Math.min(items[i].y, max);
            }
        }

        function updateTireOverlay() {
            if (!tireOverlay) buildTireOverlay();
            if (model && loadState === 'ready' && (editMode === 'wheels' || (!editMode && tireData))) ensureWheels();
            const ready = model && wheels && loadState === 'ready';
            const editing = ready && editMode === 'wheels';
            const live = ready && !editMode && tireData;
            if (live && pendingFlash.length) {
                const until = performance.now() + TIRE_SHOW_MS;
                pendingFlash = pendingFlash.filter(id => {
                    if (!tireData[id]) return true;
                    tireFlashUntil[id] = until;
                    return false;
                });
            }
            const t = performance.now() / 1000;
            const rect = renderer.domElement.getBoundingClientRect();
            const centres = {};
            if (ready) for (const id of WHEEL_IDS) centres[id] = projectToScreen(wheels[id].x, wheels[id].y, wheels[id].z, rect);
            const placed = { left: [], right: [] };
            const byX = ready ? [...WHEEL_IDS].sort((a, b) => centres[a].x - centres[b].x) : [];

            for (const id of WHEEL_IDS) {
                const d = live ? tireData[id] : null;
                const level = d ? d.level : 0;
                const color = levelColor(level);

                // Ground ring only in the setup wizard, to place the wheels
                const ring = tireRings[id];
                ring.visible = !!editing;
                if (ring.visible) {
                    const w = wheels[id];
                    ring.position.set(w.x, MODEL_FLOOR + 0.01, w.z);
                    ring.scale.setScalar(Math.max(0.6, w.r / 0.35));
                    ring.material.color.set('#4da3ff');
                    ring.material.opacity = 0.5;
                }

                const hd = tireHandles[id];
                hd.style.display = editing ? 'flex' : 'none';
                if (editing) {
                    hd.style.left = centres[id].x + 'px';
                    hd.style.top = centres[id].y + 'px';
                    hd.firstChild.textContent = (localizedStrings.wheelShort || {})[id] || id;
                }

                const lab = tireLabels[id];
                const want = !!(d && tireVisible(id, level));
                lab._a = (lab._a || 0) + ((want ? 1 : 0) - (lab._a || 0)) * 0.12;
                if (Math.abs(lab._a - (want ? 1 : 0)) < 0.01) lab._a = want ? 1 : 0;
                const show = !!d && lab._a > 0;
                lab.style.display = show ? 'block' : 'none';
                lab.style.opacity = lab._a;
                tireLeaders[id].visible = false;
                if (!show) continue;
                const base = isDarkTheme ? '#ffffff' : '#2c2c2c';
                const halo = isDarkTheme ? '#242424' : '#f0f0f0';
                // Value from a while ago (the age is in the vehicle panel): greyed
                const tone = color || (d.stale ? (isDarkTheme ? '#8a8a8a' : '#8c8c8c') : base);
                const html = d.silent
                    ? `<div style="line-height:0">${BATTERY_ERROR_SVG.replace('COLOR', color || base)}</div>`
                    : `<div style="font-size:20px;font-weight:${level ? 600 : 300};color:${tone}">${escapeHtml(d.pressure)}</div>` +
                      `<div style="font-size:16px;opacity:.75;color:${tone}">${escapeHtml(d.temp)}</div>`;
                if (lab.innerHTML !== html) lab.innerHTML = html;
                lab.style.textShadow = `0 0 4px ${halo}, 0 0 8px ${halo}`;
                const side = byX.indexOf(id) < 2 ? 'left' : 'right';
                placed[side].push({ id, y: centres[id].y, w: lab.offsetWidth, h: lab.offsetHeight, color: tone, level, alpha: lab._a });
            }
            if (!placed.left.length && !placed.right.length) return;

            // Labels beside the car, clear of the speed bar, with a thin line to their wheel
            const bar = document.getElementById('bottomBar').getBoundingClientRect();
            const sbox = modelScreenBox(rect);
            const gap = Math.min(80, Math.max(28, Math.min(rect.width, rect.height) * 0.1));
            const top = LABEL_EDGE_MARGIN_PX + topInsetPx;
            const bottom = Math.min(rect.height, bar.top - rect.top) - LABEL_EDGE_MARGIN_PX;
            for (const side of ['left', 'right']) {
                spreadVertically(placed[side], top, bottom);
                for (const it of placed[side]) {
                    const lab = tireLabels[it.id];
                    const hw = it.w / 2;
                    let lx = side === 'left' ? sbox.minX - gap - hw : sbox.maxX + gap + hw;
                    lx = Math.min(rect.width - hw - LABEL_EDGE_MARGIN_PX, Math.max(hw + LABEL_EDGE_MARGIN_PX, lx));
                    lab.style.left = lx + 'px';
                    lab.style.top = it.y + 'px';
                    const edgeX = side === 'left' ? lx + hw + 4 : lx - hw - 4;
                    setLeader(tireLeaders[it.id], it.id, edgeX, it.y, rect, it.color, (it.level ? 0.9 : 0.45) * it.alpha);
                }
            }
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Material "battery error" (outline): the sensor stopped transmitting
        const BATTERY_ERROR_SVG = '<svg width="36" height="36" viewBox="0 0 960 960" fill="COLOR"><path d="M320,880Q303,880 291.5,868.5Q280,857 280,840L280,200Q280,183 291.5,171.5Q303,160 320,160L400,160L400,80L560,80L560,160L640,160Q657,160 668.5,171.5Q680,183 680,200L680,508Q658,514 638,523.5Q618,533 600,546L600,240L360,240L360,800L508,800Q513,822 522.5,842Q532,862 545,880L320,880ZM656,880L600,824L684,740L600,656L656,600L740,684L824,600L880,656L797,740L880,824L824,880L740,797L656,880Z"/></svg>';

        // Space at the top covered by Android overlays (e.g. the maneuver), kept free of labels
        let topInsetPx = 0;
        function setTopInset(px) {
            topInsetPx = Math.max(0, px || 0);
        }

        // Wizard "Wheels" step: drag a marker onto its wheel
        let draggingWheel = null;
        const dragRay = new THREE.Raycaster();

        window.addEventListener('pointermove', ev => {
            if (!draggingWheel || !wheels) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const ndc = new THREE.Vector2(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
            dragRay.setFromCamera(ndc, camera);
            const w = wheels[draggingWheel];
            const hit = new THREE.Vector3();
            if (dragRay.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -w.y), hit)) {
                w.x = hit.x;
                w.z = hit.z;
                wheelsEdited = true;
            }
        });

        function endWheelDrag() {
            if (!draggingWheel) return;
            draggingWheel = null;
            controls.enabled = true;
        }
        window.addEventListener('pointerup', endWheelDrag);
        window.addEventListener('pointercancel', endWheelDrag);

        // Seen from above the four wheels never overlap, so every marker is easy to grab
        function wheelsPose() {
            return { az: roadPivot.rotation.y + Math.PI, h: 5.5, d: 1.6 };
        }

        function ensureWheels() {
            if (wheels || !model) return;
            editorResetWheels();
        }

        function editorResetWheels() {
            if (!model) return;
            suggestedWheels = suggestWheels();
            wheels = cloneWheels(suggestedWheels);
            wheelsEdited = false;
            wheelsRoadYaw = roadPivot.rotation.y;
        }

        // ---- Setup wizard API (Android polls editorState and reads editorGetConfig) ----

        function captureEditedPose() {
            if (editMode === 'park') parkPose = currentCameraPose();
            if (editMode === 'drive') {
                drivePose = currentCameraPose();
                roadPivot.rotation.y = snapRoadYaw(drivePose.az);
            }
        }

        function editorSetStep(step) {
            if (model) captureEditedPose();
            editMode = step;
            if (!model) return;
            if (step === 'park') setCameraPose(parkPose);
            if (step === 'drive') setCameraPose(drivePose);
            if (step === 'wheels') {
                // A new driving direction changes which corner is which: start again from the suggestions
                if (Math.abs(wheelsRoadYaw - roadPivot.rotation.y) > 1e-3) editorResetWheels();
                else ensureWheels();
                setCameraPose(wheelsPose());
            }
            if (step === 'lights') {
                if (Math.abs(lampsRoadYaw - roadPivot.rotation.y) > 1e-3) editorResetLights();
                else ensureLamps();
                setCameraPose(lightsPose());
            }
        }

        function editorTick() {
            const showRoad = editMode === 'drive';
            if (showRoad) {
                roadPivot.rotation.y = snapRoadYaw(currentCameraPose().az);
                roadOffset -= 0.06;
                roadTexture.offset.y = roadOffset;
                bendRoad();
            }
            roadCurrentOpacity = showRoad ? 0.8 : 0;
            roadMesh.material.opacity = roadCurrentOpacity;
            roadMesh.visible = showRoad;
        }

        function editorResetPose(kind) {
            if (kind === 'park') parkPose = { ...DEFAULT_PARK };
            else drivePose = { ...DEFAULT_DRIVE };
            if (model && editMode === kind) setCameraPose(kind === 'park' ? parkPose : drivePose);
        }

        function editorSetColor(key, hex) {
            if (hex) colorOverrides[key] = hex;
            else delete colorOverrides[key];
            if (model) applyColors();
        }

        // Briefly glows the parts painted with the given original colour
        function editorHighlight(key) {
            if (!model) return;
            const mats = [];
            forEachMaterial(model, m => {
                if (m.emissive && m.userData.orig && m.userData.orig.key === key) mats.push(m);
            });
            const start = performance.now();
            (function step() {
                const k = Math.max(0, 1 - (performance.now() - start) / 900);
                const v = Math.abs(Math.sin(k * Math.PI * 3)) * k;
                mats.forEach(m => {
                    m.emissive.setHex(m.userData.orig.emissive);
                    m.emissive.r += 0.3 * v;
                    m.emissive.g += 0.6 * v;
                    m.emissive.b += v;
                });
                if (k > 0) requestAnimationFrame(step);
            })();
        }

        function editorState() {
            return JSON.stringify({
                status: loadState,
                colors: model && loadState === 'ready' ? colorGroups() : []
            });
        }

        function editorGetConfig() {
            if (!model) return null;
            captureEditedPose();
            return JSON.stringify({
                yaw: model.userData.yaw,
                colors: colorOverrides,
                park: parkPose,
                drive: drivePose,
                roadYaw: roadPivot.rotation.y,
                wheels: wheelsEdited ? wheels : undefined,
                lights: lampsEdited && lamps ? { ...lamps, yaw: roadPivot.rotation.y } : undefined
            });
        }

        // Initialize when page loads
        window.addEventListener('load', () => {
            init();
        });
    </script>

    <script src="src/osm-world.js"></script>
